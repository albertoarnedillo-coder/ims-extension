<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternetMailStamp</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <span class="logo-stamp">✉</span>
      <div class="logo-text">
        <span class="logo-name">InternetMail<strong>Stamp</strong></span>
        <span class="logo-tagline">Control who reaches your inbox</span>
      </div>
    </div>
  </header>

  <!-- Login view -->
  <section id="view-login" class="view hidden">
    <p class="login-intro">
      Sign in to start protecting your inbox with digital stamps.
    </p>
    <button id="btn-login" class="btn-google">
      <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>
    <p id="login-error" class="error-msg hidden"></p>
  </section>

  <!-- Authenticated view -->
  <section id="view-main" class="view hidden">
    <div class="user-bar">
      <img id="user-avatar" class="avatar" src="" alt="" />
      <span id="user-name" class="user-name"></span>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Credits</span>
        <span id="stat-credits" class="stat-value">—</span>
        <span class="stat-unit">stamps</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Unknown</span>
        <span id="stat-unknown" class="stat-value stat-value--warn">—</span>
        <span class="stat-unit">senders</span>
      </div>
      <div class="stat-card stat-card--alert">
        <span class="stat-label">Suspicious</span>
        <span id="stat-suspicious" class="stat-value stat-value--alert">—</span>
        <span class="stat-unit">flagged</span>
      </div>
    </div>

    <div class="actions">
      <button id="btn-scan" class="btn-primary">
        <span id="scan-spinner" class="spinner hidden"></span>
        Scan Inbox
      </button>
      <button id="btn-options" class="btn-secondary">Settings</button>
    </div>

    <div class="footer-actions">
      <button id="btn-logout" class="btn-link">Sign out</button>
      <span class="dot-sep">·</span>
      <button id="btn-buy" class="btn-link btn-link--orange">Buy credits</button>
    </div>
  </section>

  <!-- Loading view -->
  <section id="view-loading" class="view">
    <div class="loader-wrap">
      <div class="loader"></div>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
